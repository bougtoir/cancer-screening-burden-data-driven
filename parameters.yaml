data_sources:
  cancer_incidence:
    source: National Cancer Center of Japan, Cancer Statistics in Japan 2016-2023
    url: https://ganjoho.jp/reg_stat/statistics/data/dl/en.html
    file: cancer_incidenceNCR_2016-2023E.xlsx
    note: Adult (20+) incidence rates for 2023 are used as a proxy for the point prevalence
      of screen-detectable cancers. Because point prevalence of undiagnosed cancers
      is usually lower than annual incidence, this tends to overestimate true positives
      and PPV and underestimate FP/TP ratios.
  population:
    source: National Cancer Center of Japan, population by age/sex 2023
    url: https://ganjoho.jp/reg_stat/statistics/data/dl/en.html
    file: cancer_incidenceNCR_2016-2023E.xlsx
  diagnostic_capacity:
    source: Ministry of Health, Labour and Welfare, 2023 Medical Facility Survey (Static/Dynamic),
      05sisetu05.xlsx
    url: https://www.mhlw.go.jp/toukei/saikin/hw/iryosd/23/
    file: 05sisetu05.xlsx
    note: September 2023 one-month patient counts are annualised (x12) and multiplied
      by AVAILABLE_CANCER_SHARE (20%) to estimate the cancer-diagnostic capacity available
      to a DTC screening wave.
  test_performance:
    source:
    - 'Kahwati LC, Avenarius M, Brouwer L, et al. Blood-Based Tests for Multiple Cancer
      Screening: A Systematic Review. AHRQ Publication No. 25-EHC033. Rockville (MD):
      Agency for Healthcare Research and Quality; 2025. https://doi.org/10.23970/AHRQEPCSRMULTIPLE'
    - 'LeeVan E, Pinsky P. Predictive Performance of Cell-Free Nucleic Acid-Based
      Multi-Cancer Early Detection Tests: A Systematic Review. Clin Chem. 2024;70(1):90-101.
      https://doi.org/10.1093/clinchem/hvad134'
    note: Base-case sensitivity 0.70 is near the MCED review median (0.73); specificity
      0.99 is within the reported range (0.657-1.0). Per-cancer values are uniform
      scenario assumptions; the specificity_sweep explores the effect of overall test
      accuracy.
  real_world_ppv:
    source: Nagamachi S et al., nationwide PET/CT facility survey on N-NOSE-triggered
      examinations (2024). https://jcpet.jp/2024/10/senchu-chosa.html
    note: Observed cancer discovery rate after N-NOSE high-risk was ~2% overall and
      <1% for the 15 target cancers; company-claimed 11.7% PPV is disputed by the
      original survey authors.
assumptions:
  available_for_cancer_share: 0.2
  pathway_note: Pathway probabilities and additional-visit counts are expert-assumption
    scenario values based on standard diagnostic guidelines, not empirical data.
  prevalence_proxy_note: Point prevalence of undiagnosed screen-detectable cancers
    is not publicly reported; adult incidence is used as a proxy. Because point prevalence
    is likely lower than annual incidence, this may overestimate true positives and
    PPV and underestimate FP/TP ratios.
